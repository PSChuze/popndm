name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard library only: nothing to install.
      - name: Tests
        run: python -m unittest discover -s . -p "test_*.py" -t .

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (the image runs the server's tests too)
        run: docker build -t popndm:ci .
      - name: Compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -p openlobby-dns -f dns/compose.yml config --quiet
        env:
          POL_ADVERTISE: 192.0.2.10
